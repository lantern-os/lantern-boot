[package]
name = "lantern-broker-service"
version = "0.0.0"
edition = "2021"
description = "A minimal standalone riscv64 ELF binary demonstrating a confined RFC-0010 capability broker: Recv's a request, mints an attenuated/badged capability, Replies with it attached. Loaded by lantern-boot's broker demo (src/broker_demo/). Deliberately zero dependencies, not even lantern-hal/lantern-kernel: it only ever issues raw ecalls."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-broker-service"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
