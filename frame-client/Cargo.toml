[package]
name = "lantern-frame-client"
version = "0.0.0"
edition = "2021"
description = "A minimal standalone riscv64 ELF binary demonstrating the RFC-0019/ADR-0024 shared-Frame client side: lantern_abi::frame::Channel::call over a real shared page (ADR-0022 Part 2), independently verifying the reply before signalling one of two granted notifications. Loaded by lantern-boot's frame demo (src/frame_demo/). Built on lantern-abi and nothing else."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-frame-client"
path = "src/main.rs"

[dependencies]
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main", features = ["rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
