[package]
name = "lantern-keystore-client"
version = "0.0.0"
edition = "2021"
description = "A minimal standalone riscv64 ELF binary demonstrating a real client of a confined lantern_crypto::Keystore over RFC-0019/ADR-0024's wire protocol: asks the keystore-service for access, then ENCRYPTs and DECRYPTs a message through it over a real shared Frame, independently verifying the round trip before signalling one of two granted notifications. Loaded by lantern-boot's keystore demo (src/keystore_demo/). Built on lantern-abi/lantern-crypto and nothing else."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-keystore-client"
path = "src/main.rs"

[dependencies]
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main", features = ["rt"] }
lantern-crypto = { git = "https://github.com/lantern-os/lantern-crypto", branch = "main", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
