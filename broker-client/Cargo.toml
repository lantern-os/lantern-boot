[package]
name = "lantern-broker-client"
version = "0.0.0"
edition = "2021"
description = "A minimal standalone riscv64 ELF binary demonstrating a confined RFC-0010 capability client: Call's a broker registering a reply-leg destination slot, then Signal's the granted capability to prove it is real and functional. Loaded by lantern-boot's broker demo (src/broker_demo/). Built on lantern-abi (RFC-0018/ADR-0022) — the non-TCB syscall-ABI crate — and nothing else."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-broker-client"
path = "src/main.rs"

[dependencies]
# Local path in this monorepo; rewrite to `git = "https://github.com/lantern-os/lantern-abi"`
# when pushing lantern-boot standalone (same split as lantern-kernel -> lantern-hal).
lantern-abi = { git = "https://github.com/lantern-os/lantern-abi", branch = "main", features = ["rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
