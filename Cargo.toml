[package]
name = "lantern-boot"
version = "0.0.0"
edition = "2021"
description = "LanternOS loader — Phase 1 prototype (RFC-0004)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-boot"
path = "src/main.rs"

[[bin]]
# RFC-0010's confined-broker demo — a second, isolated binary (own entry
# point, own trap handler); see src/broker_demo/loader.rs's module doc for
# why it isn't a third program merged into the binary above.
name = "lantern-boot-broker-demo"
path = "src/broker_demo/main.rs"

[[bin]]
# RFC-0019/ADR-0024's shared-Frame framing demo (ADR-0022 Part 2) — a third,
# isolated binary, same reasoning as the broker demo above; see
# src/frame_demo/loader.rs's module doc.
name = "lantern-boot-frame-demo"
path = "src/frame_demo/main.rs"

[[bin]]
# A real, confined lantern_crypto::Keystore, over RFC-0019/ADR-0024's wire
# protocol — a fourth, isolated binary, same reasoning as the demos above;
# see src/keystore_demo/loader.rs's module doc.
name = "lantern-boot-keystore-demo"
path = "src/keystore_demo/main.rs"

[dependencies]
lantern-hal = { git = "https://github.com/lantern-os/lantern-hal", branch = "main" }
lantern-kernel = { git = "https://github.com/lantern-os/lantern-kernel", branch = "main" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
