[package]
name = "lantern-boot"
version = "0.0.0"
edition = "2021"
description = "LanternOS loader — Phase 1 prototype (RFC-0004)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "lantern-boot"
path = "src/main.rs"

[[bin]]
# RFC-0010's confined-broker demo — a second, isolated binary (own entry
# point, own trap handler); see src/broker_demo/loader.rs's module doc for
# why it isn't a third program merged into the binary above.
name = "lantern-boot-broker-demo"
path = "src/broker_demo/main.rs"

[[bin]]
# RFC-0019/ADR-0024's shared-Frame framing demo (ADR-0022 Part 2) — a third,
# isolated binary, same reasoning as the broker demo above; see
# src/frame_demo/loader.rs's module doc.
name = "lantern-boot-frame-demo"
path = "src/frame_demo/main.rs"

[[bin]]
# A real, confined lantern_crypto::Keystore, over RFC-0019/ADR-0024's wire
# protocol — a fourth, isolated binary, same reasoning as the demos above;
# see src/keystore_demo/loader.rs's module doc.
name = "lantern-boot-keystore-demo"
path = "src/keystore_demo/main.rs"

[[bin]]
# A real, confined lantern_filesystem::Store reaching its AEAD key through a
# second confined service (a real keystore-service) -- a fifth, isolated
# binary, three confined programs at once; see src/store_demo/loader.rs's
# module doc.
name = "lantern-boot-store-demo"
path = "src/store_demo/main.rs"

[[bin]]
# lantern-runtime/riscv64-probe's Wasmtime+Pulley riscv64 link proof, actually
# loaded and run under the real kernel for the first time (RFC-0018 Part 3 /
# ADR-0023) -- a sixth, isolated binary, this crate's first single-program
# demo; see src/wasm_probe_demo/loader.rs's module doc.
name = "lantern-boot-wasm-probe-demo"
path = "src/wasm_probe_demo/main.rs"

[[bin]]
# RFC-0028's proof: a confined program sleeps on deadlines, beside a program that never yields.
# See src/deadline_demo/loader.rs's module doc.
name = "lantern-boot-deadline-demo"
path = "src/deadline_demo/main.rs"

[[bin]]
# RFC-0030's proof: a confined nursery builds, loses and reclaims child processes, more of them than any kernel pool
# holds. See src/lifecycle_demo/loader.rs's module doc.
name = "lantern-boot-lifecycle-demo"
path = "src/lifecycle_demo/main.rs"

[[bin]]
# RFC-0026's interactive system image: a person decides each grant at a console only the shell reaches.
# See src/system/loader.rs's module doc.
name = "lantern-boot-system"
path = "src/system/main.rs"

[[bin]]
# RFC-0027's proof: a confined UART driver on its own interrupts, beside a program that never yields.
# See src/irq_demo/loader.rs's module doc.
name = "lantern-boot-irq-demo"
path = "src/irq_demo/main.rs"

[[bin]]
# RFC-0018's integration proof: a confined lantern-runtime process hosting a
# real Wasm guest component whose keystore grant is served over a shared Frame
# by a separately confined keystore-service -- a seventh, isolated binary; see
# src/runtime_demo/loader.rs's module doc.
name = "lantern-boot-runtime-demo"
path = "src/runtime_demo/main.rs"

[[bin]]
# RFC-0018's filesystem integration proof: a confined lantern-runtime process
# hosting a real Wasm guest whose file grant is served by a confined
# store-service sealing through a confined keystore-service -- an eighth,
# isolated binary; see src/runtime_fs_demo/loader.rs's module doc.
name = "lantern-boot-runtime-fs-demo"
path = "src/runtime_fs_demo/main.rs"

[dependencies]
lantern-hal = { git = "https://github.com/lantern-os/lantern-hal", branch = "main" }
lantern-kernel = { git = "https://github.com/lantern-os/lantern-kernel", branch = "main" }

[features]
# `binder-matrix.sh` only: lowers the policy store's per-grant quota of operation records to 1, so the quota
# case runs in seconds (RFC-0025). It can only lower it.
audit-quota-test = []
# `scripts/irq-demo.sh` only: the irq demo's spinner parks instead of spinning, so the kernel must idle (RFC-0027).
irq-idle = []
# `scripts/console-matrix.sh` only: lowers the system image's consent limit from 60 to 2 seconds (RFC-0028). It can only
# lower it.
consent-limit-test = []
# `scripts/console-matrix.sh` only: the system image's launcher keeps each ended app resident instead of reclaiming it, so
# a test can fill every app slot (RFC-0029). It can only keep apps longer.
launcher-hold-test = []
# `scripts/deadline-demo.sh` only: the deadline demo's spinner parks, so the kernel idles between wakes (RFC-0028).
deadline-idle = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
